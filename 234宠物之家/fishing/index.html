<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#163c38"><title>钓鱼模拟器 · 234宠物之家</title><link rel="stylesheet" href="./style.css?v=1"><script src="../account.js?v=fishing1"></script></head>
<body><div class="app"><header><a href="../games.html" class="back" aria-label="返回游戏大厅">↖</a><div class="brand"><span>THE QUIET ANGLER</span><h1>钓鱼模拟器<i>一期一鱼。</i></h1></div><div class="wallet"><small>我的鱼币</small><strong>¥ <b id="money">0</b></strong></div><button id="help" class="round" aria-label="玩法说明">?</button></header>
<main><div class="heading"><div><span class="eyebrow">A LITTLE ESCAPE / 把时间交给水面</span><h2 id="map-title">湖畔 · 第一站</h2></div><button id="map-button" class="light">切换水域 ↗</button></div>
<div class="layout"><section class="play"><div class="stage"><canvas id="water" aria-label="左右钓位与四层水域"></canvas><div class="scene-top"><span id="room-label">一个人的安静时光</span><span id="weather">晴 · 微风</span></div><div class="depth-markers" aria-hidden="true"></div><div id="notice" role="status"></div><div id="duel-banner" hidden><b>同一条大鱼！</b><span id="duel-score"></span><small>连续点击搏击 · 同分随机决胜</small></div></div>
<div class="fishing-controls"><div class="depth-control"><span class="eyebrow">选择垂钓水层</span><div id="depths"></div></div><div class="cast-area"><p id="cast-hint">选好水层，抛下今天的第一竿。</p><button id="cast" class="primary">抛竿 <span>→</span></button></div></div>
<nav class="dock-nav"><button data-panel="gear"><span>⌁</span>渔具商店</button><button data-panel="inventory"><span>▤</span>鱼获仓库 <b id="bag-count">0</b></button><button data-panel="catalog"><span>◈</span>鱼类图鉴 <b id="book-count">0</b></button></nav></section>
<aside><section class="side-card equipment"><div class="card-heading"><h3>我的钓具</h3><button data-panel="gear">更换 ↗</button></div><div id="equipped"></div><div class="line-limit" id="limit"></div></section><section class="side-card together"><span class="eyebrow">BETTER TOGETHER</span><h3>留一个位置，给好友。</h3><p id="friend-status">分享房间码，一人一侧，边聊边钓。</p><button id="friend-button" class="light">邀请 / 加入好友 ↗</button></section>
<section class="side-card chat"><div class="card-heading"><h3>水边闲聊</h3><small id="online">未同钓</small></div><div id="messages" role="log" aria-live="polite"><p class="system">好友入座后，就能在这里聊天。</p></div><form id="chat-form"><input id="chat-input" aria-label="聊天内容" maxlength="120" placeholder="聊聊今天的鱼获…" autocomplete="off" disabled><button id="send" aria-label="发送消息" disabled>↑</button></form></section></aside></div>
<footer><span><span id="save-status">正在读取存档…</span> · <a href="../account.html">账号中心</a></span><span>湖畔 → 江岸 → 远海 · 集齐图鉴，继续远行</span></footer></main></div>
<dialog id="modal"><div class="modal-head"><div><span id="modal-kicker" class="eyebrow"></span><h2 id="modal-title"></h2></div><button id="close-modal" class="round" aria-label="关闭">×</button></div><div id="modal-body"></div></dialog><script type="module" src="./game.mjs?v=2"></script></body></html>
