<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>234宠物之家</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./game.js"></script>
</head>
<body>
  <header><div class="brand"><span class="paw" aria-hidden="true">🐾</span>234宠物之家</div><span class="room">宠物游戏室</span></header>
  <main>
    <div class="intro"><span class="eyebrow">桌游角 <i></i> 01</span><h1>五子棋</h1><p>和身边的朋友下一盘，先连成五子的一方获胜。</p></div>
    <div class="layout">
      <section class="board-card" aria-label="五子棋盘"><div id="board" role="group" aria-label="十五路棋盘，可用方向键移动，回车键落子"></div></section>
      <aside>
        <div class="panel-head"><h2>本局对弈</h2><span class="badge">双人同屏</span></div>
        <p class="status" id="status" role="status"></p>
        <div class="players"><div><i class="sample black"></i>黑棋 <small>先手</small></div><div><i class="sample white"></i>白棋 <small>后手</small></div></div>
        <div class="detail">已落子 <strong id="count">0</strong></div>
        <div class="controls"><button id="undo" type="button">↶ 悔棋</button><button id="restart" type="button">重新开局</button></div>
        <section class="rules"><h2>玩法</h2><p>黑棋先行，双方轮流点击交叉点落子。横、竖或斜向连成五子或以上即胜。棋盘下满仍无胜方则为和棋。</p></section>
      </aside>
    </div>
  </main>
</body>
</html>
