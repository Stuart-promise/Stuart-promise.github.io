<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>森林弹弹队 · 234宠物之家</title><link rel="stylesheet" href="./style.css?v=peer1"><link rel="stylesheet" href="./forest.css?v=1"><script type="module" src="./forest.js?v=1"></script></head>
<body><header><a class="brand" href="./"><span class="paw">🐾</span>234宠物之家</a><a class="back-home" href="./games.html?v=forest1">← 游戏列表</a></header>
<main class="forest"><h1>森林弹弹队</h1><p class="lede">扭出动物伙伴，把同种动物合在一起，守住林间营地。</p>
<div class="forest-layout"><section class="machine" aria-label="森林防守棋盘">
<div class="hud"><span>营地 <b id="life"></b></span><span>第 <b id="wave"></b> 波</span><span>松果 <b id="nuts"></b></span></div>
<div class="field"><div id="grid" aria-label="动物阵地"></div><svg id="action" viewBox="0 0 440 440" aria-hidden="true"><path id="trail" fill="none" d="M220 48 H352 Q392 48 392 88 V352 Q392 392 352 392 H88 Q48 392 48 352 V88 Q48 48 88 48 Z"></path><g id="foes"></g><g id="shots"></g></svg><div id="reveal" hidden></div></div>
<div class="console"><button id="recruit"><i class="knob" aria-hidden="true"></i> 扭一次 <small>5 松果</small></button><button id="go"></button></div>
<p id="notice" role="status"></p></section>
<aside class="logbook"><div class="panel-head"><h2>动物图鉴</h2><b id="seen"></b></div><div id="album"></div><p id="best"></p>
<details open><summary>怎么玩</summary><p>每波开始前可以布阵。点一只动物，再点空位移动；点另一只同种动物可合成进化。也可以直接拖动。</p><p>地面伙伴的松果会弹向附近的虫子，飞羽伙伴会让目标减速。靠近道路才打得到，拐角适合同时照看两段路。</p><p>每赶走一只虫子赚 2 松果，每过一波再得 5 松果。守过第 2、5 波后，扭蛋分别有机会招到二级、三级动物。漏掉普通虫损失 1 点营地耐久，虫王损失 3 点。守完 10 波获胜。</p></details>
<button id="restart">重新开局</button><small id="storage">图鉴与最佳防守波数保存在此浏览器。</small></aside></div></main></body></html>
