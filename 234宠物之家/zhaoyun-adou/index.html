<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#191c19">
  <title>赵云与阿斗 · 234宠物之家</title>
  <link rel="stylesheet" href="./duel.css?v=1">
  <script defer src="../account.js?v=zyad1"></script>
  <script defer src="../room-config.js?v=crossplay2"></script>
  <script defer src="../relay.js?v=crossplay2"></script>
  <script defer src="./cloud-save.js?v=1"></script>
  <script defer src="./duel-room.js?v=1"></script>
  <!-- 原工程 https://github.com/qq865738120/zhaoyun_adou/tree/634f93f03ab9860ab828e1a4a09875b76772bbc1 · Cocos Creator 3.8.8 · 网站加载适配见 tools/zhaoyun-adou/ -->
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { background: #191c19; color: #ece5cf; font: 14px/1.4 system-ui, "Microsoft YaHei", sans-serif; }
    main { height: 100%; height: 100dvh; display: flex; flex-direction: column; }
    nav { flex: none; background: #20241f; }
    .tools { min-height: 36px; padding: max(3px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 3px max(12px, env(safe-area-inset-left)); display: flex; align-items: center; justify-content: space-between; }
    .tools a, .tools button { color: inherit; font: inherit; text-decoration: none; background: none; border: 0; cursor: pointer; padding: 5px 8px; }
    .tools :focus-visible { outline: 2px solid #f4c76f; outline-offset: -2px; }
    .stage { flex: 1; min-height: 0; display: grid; justify-items: center; container-type: size; padding-bottom: env(safe-area-inset-bottom); }
    iframe { display: block; width: 100%; max-width: 640px; height: 100%; border: 0; background: #151714; }
    @supports (width: 1cqh) { iframe { width: min(100cqw, 46.176cqh); } }
  </style>
</head>
<body>
  <main id="game">
    <nav aria-label="游戏导航"><div class="tools">
      <a href="../games.html">‹ 游戏大厅</a>
      <a id="zyad-save-status" href="../account.html" aria-live="polite">读取存档…</a>
      <button type="button" id="open-duel" aria-haspopup="dialog">好友对战</button>
      <button type="button" id="fullscreen" hidden>全屏</button>
    </div></nav>
    <div class="stage"><iframe id="play-frame" data-src="./play/index.html?v=3" title="赵云与阿斗游戏" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
    <dialog id="duel-dialog" aria-labelledby="duel-title">
      <div class="duel-panel">
        <div class="duel-heading"><h1 id="duel-title">好友对战</h1><button id="dismiss-duel" type="button" aria-label="关闭好友对战面板">关闭</button></div>
        <p id="duel-note" role="status" aria-live="polite">和好友各自布阵，在同一场守关战里比拼。</p>
        <div id="room-entry">
          <button type="button" class="duel-primary" id="create-room">创建双人房间</button>
          <form id="join-form">
            <label for="room-input">好友的房间码</label>
            <div class="join-fields"><input id="room-input" type="text" inputmode="numeric" autocomplete="off" placeholder="6 位数字" maxlength="7" required><button type="submit" id="join-room">加入房间</button></div>
          </form>
        </div>
        <div id="room-details" hidden>
          <div class="room-id"><span>房间码</span><strong id="room-number"></strong></div>
          <button type="button" class="duel-primary" id="copy-invite">复制邀请链接</button>
          <input id="share-url" aria-label="邀请链接" type="text" readonly hidden>
          <button type="button" id="leave-room">退出房间</button>
        </div>
        <details id="duel-history"><summary>好友对战记录</summary><ol id="duel-records"></ol></details>
      </div>
    </dialog>
  </main>
  <script>
    const game = document.getElementById('game');
    const fullscreen = document.getElementById('fullscreen');
    if (document.fullscreenEnabled && game.requestFullscreen) {
      fullscreen.hidden = false;
      fullscreen.addEventListener('click', async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await game.requestFullscreen();
        } catch { /* The browser can decline fullscreen. */ }
      });
      document.addEventListener('fullscreenchange', () => {
        fullscreen.textContent = document.fullscreenElement ? '退出全屏' : '全屏';
      });
    }
  </script>
</body>
</html>
